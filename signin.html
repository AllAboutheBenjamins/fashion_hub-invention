<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lets Sign you In — FASHION HUB</title>

  <!-- Local Stylesheets (No CDN) -->
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/tailwind.min.css">
  <link rel="stylesheet" href="./css/style.css">

  <!-- Local Scripts (No CDN) -->
  <script src="./js/alpine.min.js" defer></script>
  <script type="module" src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/main.js" defer></script>
</head>
<body class="auth-page-bg" x-data="{ email: 'customer@gmail.com', password: '••••••••••••', remember: true }">

  <!-- Blurred Editorial Overlay Background -->
  <img src="./assets/Create account images/Blury overlay image/nicolas-ladino-silva-etgBglCmpg8-unsplash.jpg" alt="" class="auth-bg-img">
  <div class="auth-bg-overlay"></div>

  <main class="auth-modal-card" style="max-width: 470px; border-radius: 10px; padding: clamp(2.25rem, 4vw, 3rem);">
    <div class="text-center mb-4">
      <h1 class="font-editorial mb-2" style="font-size: clamp(1.75rem, 3vw, 2.2rem); color: var(--color-noir);">Lets Sign you In</h1>
      <p class="mb-0 mx-auto" style="font-size: 0.78rem; color: var(--color-muted); max-width: 280px; line-height: 1.55;">
        Sign in to view your orders, saved items, and account details.
      </p>
    </div>

    <form @submit.prevent="window.FashionHub.showToast('Signed in as The Benjamins.'); setTimeout(() => window.location.href='./dashboard.html', 800);" class="d-flex flex-column gap-3">
      <div>
        <label class="d-block mb-1" style="font-size: 0.6rem; font-weight: 700; letter-spacing: 0.14em; color: var(--color-noir);">EMAIL ADDRESS</label>
        <input type="email" required x-model="email" class="auth-input" placeholder="customer@gmail.com">
      </div>

      <div>
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label style="font-size: 0.6rem; font-weight: 700; letter-spacing: 0.14em; color: var(--color-noir);">PASSWORD</label>
          <a href="#" @click.prevent="window.FashionHub.showToast('Password reset link sent to your email.')" style="font-size: 0.65rem; color: var(--color-muted);">Forgot Password?</a>
        </div>
        <div class="position-relative">
          <input type="password" id="signinPassword" required x-model="password" class="auth-input pe-5">
          <button type="button" class="password-toggle-btn position-absolute border-0 bg-transparent p-0" data-target="signinPassword" style="right: 12px; top: 50%; transform: translateY(-50%); color: var(--color-muted);" aria-label="Toggle Password Visibility">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <label class="d-flex align-items-center gap-2 my-1" style="font-size: 0.75rem; color: var(--color-noir); cursor: pointer;">
        <input type="checkbox" x-model="remember" class="form-check-input mt-0" style="accent-color: var(--color-noir);">
        <span>Remember this device for 30 days</span>
      </label>

      <button type="submit" class="w-100 border-0 rounded-1 py-3 d-flex align-items-center justify-content-between px-4" style="background-color: var(--color-noir); color: #FFFFFF; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em;">
        <span>SIGN IN</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="d-flex align-items-center gap-3 my-4">
      <hr class="flex-grow-1 m-0" style="border-color: var(--color-border);">
      <span style="font-size: 0.6rem; font-weight: 700; letter-spacing: 0.14em; color: var(--color-muted);">OR CONNECT VIA</span>
      <hr class="flex-grow-1 m-0" style="border-color: var(--color-border);">
    </div>

    <div class="row g-2 mb-4">
      <div class="col-6">
        <button type="button" @click="window.FashionHub.showToast('Signing in with Apple...')" class="btn-social-auth">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.428-2.8-1.287-1.82-2.323-4.63-2.323-7.28 0-4.28 2.797-6.55 5.552-6.55 1.448 0 2.675.95 3.6.95.865 0 2.222-1.01 3.902-1.01.613 0 2.886.06 4.374 2.19-.13.09-2.383 1.37-2.383 4.19 0 3.26 2.854 4.42 2.955 4.45z"/></svg>
          <span>Apple</span>
        </button>
      </div>
      <div class="col-6">
        <button type="button" @click="window.FashionHub.showToast('Signing in with Google...')" class="btn-social-auth">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/></svg>
          <span>Google</span>
        </button>
      </div>
    </div>

    <div class="text-center">
      <div class="mb-2" style="font-size: 0.75rem; color: var(--color-muted);">
        New to Fashion Hub? <a href="./create-account.html" style="color: var(--color-terracotta); font-weight: 700; letter-spacing: 0.06em;">CREATE AN ACCOUNT</a>
      </div>
      <div class="d-inline-flex align-items-center gap-1" style="font-size: 0.65rem; color: var(--color-muted);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        <span>Need help signing in? <a href="./dashboard.html" class="text-decoration-none text-reset">Contact Customer Support</a></span>
      </div>
    </div>
  </main>

</body>
</html>
